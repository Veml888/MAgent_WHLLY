name: Build & Release

# 两种触发方式：
# 1. 推送 v* 标签（如 v0.1.1）→ 自动构建三件套并发布 Release
# 2. 手动触发（workflow_dispatch）→ 只构建并上传构建产物，用于验证流水线，不发 Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt pyinstaller pytest ruff

      - name: 代码风格检查
        run: python -m ruff check .

      - name: 运行单元测试
        run: python -m pytest tests -q

      - name: 从 tag 同步版本号
        if: github.ref_type == 'tag'
        shell: python {0}
        run: |
          import os, re, pathlib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          p = pathlib.Path("pyproject.toml")
          p.write_text(
              re.sub(r'(?m)^version = ".*"', f'version = "{tag}"', p.read_text(encoding="utf-8")),
              encoding="utf-8",
          )
          print("pyproject version →", tag)

      - name: 构建绿色包（内嵌 Python）
        run: python scripts/build_portable.py

      - name: 构建单文件 exe
        run: python scripts/make_exe.py

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 构建安装包
        run: python scripts/make_setup.py

      # 非标签运行（手动触发）：产物作为 workflow artifact 供下载验证，不发布
      - name: 上传构建产物（仅手动触发时）
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/MAgent.exe
            dist/MAgent-Setup-*.exe
            dist/MAgent-*-portable.zip

      # 标签运行：发布 Release
      - name: 发布 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: MAgent ${{ github.ref_name }}
          body: |
            ## 下载

            - **普通用户（推荐）**：`MAgent-Setup-*.exe` —— 标准安装向导，自动建快捷方式，控制面板可卸载
            - **免安装**：`MAgent.exe`（单文件，下完双击）或 `MAgent-*-portable.zip`（绿色文件夹版）
            - 三者功能完全相同，任选其一

            ## 使用

            双击启动 → 弹出桌面窗口 → 设置页填 API Base URL / Key / 模型名（默认 DeepSeek）
            → 测试连接 → 新建项目（题面文件）→ 在工序线上点「启动」。

            本软件调用你自己的模型 API，费用由你的账号承担。
          files: |
            dist/MAgent-Setup-*.exe
            dist/MAgent-*-portable.zip
            dist/MAgent.exe
