[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magent"
version = "0.2.0"
description = "MAgent —— CUMCM 数学建模全流程 Agent 软件（BYOK 接任意 OpenAI 兼容模型）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13.0",
    "PyMuPDF>=1.24",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
magent = "magent.cli:main"

[tool.setuptools.packages.find]
include = ["magent*"]

[tool.setuptools.package-data]
magent = [
    "web/*",
    "skills/*",
    "skills/*/*",
    "skills/*/*/*",
    "skills/*/*/*/*",
    "skills/*/*/*/*/*",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# skills/ 是上游 MM_workflow 的内容层拷贝，不参与本仓库 lint
extend-exclude = ["dist", "build", "magent/skills"]

[tool.ruff.lint]
# E4/E7/E9 语法与逻辑错误；F pyflakes（未用导入/变量）；I 导入排序；W 空白
select = ["E4", "E7", "E9", "F", "I", "W"]
