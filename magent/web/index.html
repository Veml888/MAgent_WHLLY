<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAgent · 数模全流程</title>
<style>
  /* ============ 设计令牌 ============
     深色科技 / 高级感：层叠深面 + 冷青蓝光带 + LED 状态灯
     渐变只用于工序光带一处，其余克制 */
  :root {
    --bg0: #0C0F14;          /* 深空底 */
    --bg1: #12161D;          /* 面板 */
    --bg2: #1A2029;          /* 抬升层 / 悬停 */
    --line: #232B36;         /* 边线 */
    --ink: #E8ECF1;          /* 正文 */
    --soft: #9AA3AE;         /* 次级文字 */
    --acc: #4ED0C4;          /* 冰青 */
    --acc2: #6AA6FF;         /* 晶蓝 */
    --acc-grad: linear-gradient(90deg, var(--acc), var(--acc2));
    --pass: #3ECF8E;         /* 通过 翡翠 */
    --fail: #FF6B5E;         /* 失败 珊瑚红 */
    --hold: #E8B45A;         /* 挂起 琥珀 */
    --na: #6F7A87;           /* 不适用 灰 */
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    --sans: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--sans); color: var(--ink); font-size: 15px; line-height: 1.65;
    background-color: var(--bg0);
    background-image:
      radial-gradient(ellipse 60% 45% at 18% -8%, rgba(106,166,255,.10), transparent),
      radial-gradient(ellipse 55% 40% at 95% 108%, rgba(78,208,196,.07), transparent);
    display: grid; grid-template-columns: 250px 1fr; min-height: 100vh;
  }
  ::selection { background: rgba(78,208,196,.25); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2A3340; border-radius: 8px; border: 2px solid var(--bg1); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============ 左栏（只留入口） ============ */
  aside {
    border-right: 1px solid var(--line); background: linear-gradient(180deg, var(--bg1), rgba(18,22,29,.6));
    padding: 24px 20px; display: flex; flex-direction: column; gap: 22px;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { line-height: 1.3; }
  .brand .word {
    font-family: var(--sans); font-weight: 650; font-size: 23px; letter-spacing: 4px;
    background: var(--acc-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .sub { color: var(--soft); font-size: 13.5px; letter-spacing: 5px; margin-top: 2px; }
  .nav { display: flex; flex-direction: column; gap: 8px; }
  .nav button {
    width: 100%; text-align: left; padding: 10px 14px; font-size: 14.5px;
  }
  /* ---- 工作区文件树 ---- */
  .ws { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .ws-head {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--soft);
    letter-spacing: 1px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
  }
  .ws-head button.mini {
    padding: 1px 8px; font-size: 13px; line-height: 1.4; border-radius: 6px;
  }
  .tree { overflow-y: auto; flex: 1; min-height: 80px; font-size: 13px; }
  .tree .empty-tip { color: var(--soft); font-size: 12.5px; padding: 8px 2px; line-height: 1.6; }
  .node {
    display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px;
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--ink); border: none; background: none; width: 100%; text-align: left;
    font-family: var(--sans); font-size: 13px;
  }
  .node:hover { background: rgba(255,255,255,.06); }
  .node .ic { color: var(--acc); font-family: var(--mono); font-size: 11px; flex: none; }
  .node.dir .ic { color: var(--hold); }
  .node .nm { overflow: hidden; text-overflow: ellipsis; }
  .node .sz { margin-left: auto; color: var(--soft); font-family: var(--mono); font-size: 10.5px; flex: none; }
  .tree .children { margin-left: 10px; border-left: 1px dashed rgba(255,255,255,.07); padding-left: 4px; }

  /* ---- 多工作区条目 ---- */
  .wsitem { border-radius: 8px; margin-bottom: 2px; }
  .wsitem.active { background: rgba(78,208,196,.10); box-shadow: inset 2px 0 0 var(--acc); }
  .wsrow { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
  .wsrow:hover { background: rgba(255,255,255,.05); }
  .wsrow .caret { color: var(--soft); font-family: var(--mono); font-size: 11px; width: 12px; flex: none; }
  .wsrow .wsname {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13.5px; font-weight: 600;
  }
  .wsitem.active .wsname { color: var(--acc); }
  .wsrow .wscount { font-family: var(--mono); font-size: 10.5px; color: var(--soft); flex: none; }
  .wsrow .dotrun {
    width: 7px; height: 7px; border-radius: 50%; background: var(--acc); flex: none;
    box-shadow: 0 0 8px rgba(78,208,196,.9); animation: pulse2 1.2s ease-in-out infinite;
  }
  .wsrow .wsx {
    color: var(--soft); font-size: 14px; line-height: 1; padding: 0 3px; flex: none;
    visibility: hidden; cursor: pointer;
  }
  .wsrow:hover .wsx { visibility: visible; }
  .wsrow .wsx:hover { color: var(--fail); }
  .railfoot { margin-top: auto; font-size: 12.5px; color: var(--soft); font-family: var(--mono); }

  /* ---- 文件预览视图 ---- */
  #viewer {
    position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
    background: var(--bg0);
  }
  #viewer .vhead {
    display: flex; align-items: center; gap: 14px; padding: 16px 30px;
    border-bottom: 1px solid var(--line); background: rgba(12,15,20,.95);
  }
  #viewer .vhead h2 { margin: 0; font-size: 16.5px; font-family: var(--mono); letter-spacing: .5px; }
  #viewer .vbody { flex: 1; overflow: auto; padding: 22px 30px; }
  #viewer pre {
    margin: 0; font-family: var(--mono); font-size: 13.5px; line-height: 1.75;
    white-space: pre-wrap; word-break: break-word; color: var(--ink);
  }
  #viewer img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  #viewer iframe { width: 100%; height: 100%; border: none; border-radius: 8px; background: #fff; }
  #viewer .center { text-align: center; color: var(--soft); padding-top: 40px; }

  /* ============ 通用控件 ============ */
  input, select {
    width: 100%; padding: 8px 11px; font-size: 14px; font-family: var(--sans);
    border: 1px solid var(--line); border-radius: 7px; background: var(--bg0); color: var(--ink);
    transition: border-color .15s;
  }
  input:hover, select:hover { border-color: #313C4B; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px rgba(78,208,196,.18);
  }
  input.mono { font-family: var(--mono); font-size: 13px; }
  label { font-size: 13px; color: var(--soft); display: block; margin-bottom: 4px; }
  button {
    padding: 8px 18px; font-size: 14px; font-family: var(--sans); cursor: pointer;
    border: 1px solid var(--line); background: var(--bg2); color: var(--ink); border-radius: 7px;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  button:hover { border-color: #3A4656; background: #1F2630; }
  button.primary { background: var(--acc-grad); border: none; color: #07131A; font-weight: 650; }
  button.primary:hover { box-shadow: 0 0 18px rgba(78,208,196,.35); }
  button.danger { color: var(--fail); border-color: rgba(255,107,94,.35); }
  button.danger:hover { background: rgba(255,107,94,.10); border-color: var(--fail); }
  button:disabled { color: var(--na); background: transparent; cursor: not-allowed; box-shadow: none; }
  .msg { font-size: 13px; }
  .msg.ok { color: var(--pass); } .msg.bad { color: var(--fail); }
  .spacer { flex: 1; }
  .hint { font-size: 13px; color: var(--soft); }
  .hidden { display: none !important; }

  /* ============ 主区 ============ */
  main { padding: 30px 38px 40px; max-width: 1080px; }
  main > section { margin-bottom: 40px; }
  .sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  .sec-head .no { font-family: var(--mono); font-size: 13px; color: var(--acc); letter-spacing: 1px; }
  .sec-head h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: 1px; }
  .sec-head h3 { margin: 0; font-size: 16.5px; font-weight: 650; letter-spacing: 1px; }

  .banner {
    display: flex; align-items: center; gap: 14px; margin-bottom: 18px; padding: 12px 16px;
    border: 1px solid rgba(232,180,90,.4); background: rgba(232,180,90,.08); border-radius: 10px;
    color: var(--hold); font-size: 14px;
  }

  /* ---- 工序光带 ---- */
  .process { position: relative; padding-top: 4px; }
  .rail-line {
    position: absolute; top: 24px; left: 16px; right: 16px; height: 2px;
    background: linear-gradient(90deg, rgba(78,208,196,.9), rgba(106,166,255,.5), rgba(255,255,255,.08));
    box-shadow: 0 0 12px rgba(78,208,196,.35);
    transform-origin: left; animation: draw .9s ease-out both;
  }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .rail-line { animation: none; } }
  #stages { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; position: relative; }
  @media (max-width: 1120px) { #stages { grid-template-columns: repeat(4, 1fr); row-gap: 30px; } }
  .stop { position: relative; }
  .stop .dot {
    width: 16px; height: 16px; border-radius: 50%; margin-bottom: 12px;
    background: var(--bg0); border: 2px solid #3A4656; position: relative; z-index: 1;
    transition: background .2s, box-shadow .2s;
  }
  .stop.on .dot { background: var(--acc); border-color: var(--acc); box-shadow: 0 0 14px rgba(78,208,196,.8); }
  .stop.done .dot { background: var(--pass); border-color: var(--pass); box-shadow: 0 0 12px rgba(62,207,142,.55); }
  .stop.bad .dot { background: var(--fail); border-color: var(--fail); box-shadow: 0 0 12px rgba(255,107,94,.55); }
  .stop.running .dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 26px rgba(78,208,196,1); } }
  .stop .name { font-size: 16.5px; font-weight: 650; margin: 2px 0 4px; letter-spacing: .5px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; letter-spacing: 1px;
    padding: 3.5px 12px; border-radius: 999px; border: 1px solid; margin-bottom: 12px;
  }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st-pending     { color: var(--na); border-color: rgba(111,122,135,.4); background: rgba(111,122,135,.08); }
  .st-in_progress { color: var(--acc); border-color: rgba(78,208,196,.45); background: rgba(78,208,196,.10); }
  .st-in_progress i { animation: pulse2 1.2s ease-in-out infinite; }
  @keyframes pulse2 { 50% { opacity: .35; } }
  .st-complete    { color: var(--pass); border-color: rgba(62,207,142,.45); background: rgba(62,207,142,.10); }
  .st-failed      { color: var(--fail); border-color: rgba(255,107,94,.45); background: rgba(255,107,94,.10); }
  .st-n_a         { color: var(--na); border-color: rgba(111,122,135,.3); background: transparent; }
  .st-n_a .label { text-decoration: line-through; }
  .st-conditional { color: var(--hold); border-color: rgba(232,180,90,.45); background: rgba(232,180,90,.10); }
  .stop .actions { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .stop .actions button { padding: 5px 13px; font-size: 13.5px; }

  /* ---- 面板 / 记录流 ---- */
  .panel {
    background: linear-gradient(180deg, var(--bg1), rgba(18,22,29,.7));
    border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px;
  }
  .grid4 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 1120px) { .grid4 { grid-template-columns: 1fr; } }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  #log {
    background: var(--bg1); border: 1px solid var(--line); border-radius: 12px;
    height: 330px; overflow-y: auto; padding: 16px 20px;
    font-family: var(--mono); font-size: 13.5px; line-height: 1.85; white-space: pre-wrap; word-break: break-all;
  }
  #log .t { color: #5C6875; }
  #log .think { color: #8B93A1; font-style: italic; }
  #log .used { color: var(--hold); font-family: var(--mono); font-size: 12px; }
  .stop .usedtime { font-family: var(--mono); font-size: 11.5px; color: var(--soft); margin: 2px 0 6px; }
  #log .ok { color: var(--pass); } #log .bad { color: var(--fail); } #log .dim { color: var(--soft); }
  .inline-file { font-size: 13px; color: var(--soft); }
  .inline-file input { border: none; padding: 0; background: transparent; box-shadow: none; }
  .inline-file input:focus-visible { outline: none; }
  .path-row { display: flex; gap: 8px; }
  .path-row input { flex: 1; }
  .path-row button { padding: 8px 14px; font-size: 13.5px; white-space: nowrap; }
  #recent_wrap select { max-width: 230px; }

  /* ============ 设置视图（覆盖全屏） ============ */
  #settingsView {
    position: fixed; inset: 0; z-index: 50; overflow-y: auto;
    background: var(--bg0);
    background-image:
      radial-gradient(ellipse 60% 45% at 18% -8%, rgba(106,166,255,.10), transparent),
      radial-gradient(ellipse 55% 40% at 95% 108%, rgba(78,208,196,.07), transparent);
    padding: 0 0 70px;
  }
  .ov-head {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px;
    padding: 18px 38px; background: rgba(12,15,20,.92); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .ov-head h2 { margin: 0; font-size: 19px; letter-spacing: 1px; }
  .ov-body { max-width: 1000px; margin: 0 auto; padding: 30px 38px 0; display: grid; gap: 38px; }
  .ov-body section > .sec-head { margin-bottom: 14px; }

  .prov {
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 14px;
    background: linear-gradient(180deg, var(--bg1), rgba(18,22,29,.7)); margin-bottom: 12px;
  }
  .prov-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .prov-head input { max-width: 260px; font-size: 15px; font-weight: 600; }
  .prov-head button { padding: 6px 14px; font-size: 13.5px; }
  .prov .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 900px) { .prov .grid3 { grid-template-columns: 1fr; } }
  .prov .msg { display: block; min-height: 18px; margin-top: 8px; }

  .route-row {
    display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: center;
    padding: 7px 0; border-bottom: 1px dashed rgba(255,255,255,.05);
  }
  .route-row:last-child { border-bottom: none; }
  .route-row .rname { font-size: 14.5px; }
  .route-row .rname b { color: var(--acc); font-weight: 600; margin-right: 6px; font-family: var(--mono); font-size: 12.5px; }
  .route-row select { max-width: 320px; }

  .empty-tip { color: var(--soft); font-size: 14px; padding: 10px 2px; }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <div class="word">MAGENT</div>
    <div class="sub">数模全流程引擎</div>
  </div>
  <div class="nav">
    <button onclick="openSettings()">⚙&nbsp;&nbsp;设置</button>
  </div>

  <div class="ws">
    <div class="ws-head">
      <span>工作区</span>
      <span class="spacer"></span>
      <button class="mini" onclick="addWorkspacePrompt()" title="打开任意文件夹作为工作区">＋</button>
      <button class="mini" onclick="refreshWorkspaces(true)" title="刷新">↻</button>
    </div>
    <div id="wslist" class="tree"><div class="empty-tip">尚未添加工作区<br>· 新建题目：右侧「项目」区选题面后点「创建项目」<br>· 打开文件夹：点上方 ＋ 选任意文件夹</div></div>
  </div>

  <div class="railfoot">
    <div id="ver"></div>
  </div>
</aside>

<main>
  <section>
    <div class="sec-head">
      <span class="no">01</span><h2>项目</h2>
      <span class="hint" id="proj_now"></span>
    </div>
    <div class="banner hidden" id="init_banner">
      <span id="init_banner_text">该文件夹还不是 MAgent 项目</span>
      <span class="spacer"></span>
      <button class="primary" onclick="initCurrentWorkspace()">初始化为项目</button>
    </div>
    <div class="banner hidden" id="key_banner">
      <span>尚未配置模型服务</span>
      <span class="spacer"></span>
      <button class="primary" onclick="openSettings()">去设置</button>
    </div>
    <div class="panel">
      <div class="row" style="margin-top:0">
        <button onclick="document.getElementById('proj_files').click()">选择题面文件…</button>
        <input id="proj_files" type="file" multiple class="hidden" accept=".pdf,.docx,.doc,.md,.txt,.csv,.xlsx,.xls,.zip,.png,.jpg,.jpeg" onchange="updateFileSummary()">
        <button onclick="document.getElementById('proj_dir').click()">上传附件文件夹…</button>
        <input id="proj_dir" type="file" webkitdirectory multiple class="hidden" onchange="updateFileSummary()">
        <span class="hint" id="file_summary"></span>
        <span class="spacer"></span>
        <button class="primary" onclick="createProject()">创建项目</button>
        <span class="msg" id="proj_msg"></span>
      </div>
      <div class="row">
        <span class="hint">侧重点</span>
        <select id="proj_focus" style="max-width:180px">
          <option>均衡</option><option>精度优先</option>
          <option>可解释性优先</option><option>速度优先</option>
        </select>
        <span class="hint" id="auto_name_hint">项目名与位置自动生成（如 D:\2026-国赛B题），无需填写</span>
      </div>
    </div>
  </section>

  <section>
    <div class="sec-head">
      <span class="no">02</span><h2>工序</h2>
      <span class="hint" id="pipe_hint"></span>
      <span class="spacer"></span>
      <button id="pipe_auto_btn" class="primary" onclick="startPipeline('auto')">▶&nbsp;全自动运行</button>
      <button id="pipe_step_btn" onclick="startPipeline('step')">▶&nbsp;逐步运行</button>
      <button id="pipe_stop_btn" class="danger hidden" onclick="stopPipeline()">⏸&nbsp;停止</button>
    </div>
    <div class="process">
      <div class="rail-line"></div>
      <div id="stages"></div>
    </div>
  </section>

  <section>
    <div class="sec-head">
      <span class="no">03</span><h2>运行记录</h2>
      <span class="spacer"></span>
      <button onclick="clearLog()">清屏</button>
    </div>
    <div id="log"><span class="dim">暂无运行记录</span></div>
  </section>
</main>

<!-- ============ 设置视图 ============ -->
<div id="settingsView" class="hidden">
  <header class="ov-head">
    <button onclick="closeSettings()">← 返回</button>
    <h2>设置</h2>
    <span class="spacer"></span>
    <span class="msg" id="settings_msg"></span>
    <button class="primary" onclick="saveSettings()">保存全部设置</button>
  </header>

  <div class="ov-body">
    <section>
      <div class="sec-head">
        <h3>模型服务</h3>
        <span class="hint">任意 OpenAI 兼容服务，可添加多个</span>
        <span class="spacer"></span>
        <button onclick="addProvider()">＋ 添加服务</button>
      </div>
      <div id="providers"></div>
    </section>

    <section>
      <div class="sec-head">
        <h3>阶段路由</h3>
        <span class="hint">不同阶段可使用不同模型服务</span>
      </div>
      <div class="panel">
        <div class="route-row">
          <span class="rname"><b>默认</b>所有阶段</span>
          <select id="route_default"></select>
        </div>
        <div id="routes"></div>
      </div>
    </section>

    <section>
      <div class="sec-head"><h3>高级</h3></div>
      <div class="panel">
        <label>skills 目录（留空 = 使用软件内置副本）</label>
        <input id="skills_root" class="mono" placeholder="内置副本">
      </div>
    </section>
  </div>
</div>

<!-- ============ 文件预览视图 ============ -->
<div id="viewer" class="hidden">
  <div class="vhead">
    <button onclick="closeViewer()">← 返回</button>
    <h2 id="viewer_name"></h2>
    <span class="spacer"></span>
    <span class="hint" id="viewer_meta"></span>
    <button onclick="openExternal()">用系统程序打开</button>
  </div>
  <div class="vbody" id="viewer_body"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let ACTIVE_ROOT = localStorage.getItem("magent_root") || "";
let es = null, timer = null;
let META = { stages: [] };

function msg(id, text, ok) {
  const el = $(id); el.textContent = text; el.className = "msg " + (ok ? "ok" : "bad");
  setTimeout(() => { if (el.textContent === text) el.textContent = ""; }, 6000);
}
function logLine(html) {
  const el = $("log");
  if (el.querySelector(".dim")) el.textContent = "";
  el.innerHTML += html + "\n";
  el.scrollTop = el.scrollHeight;
}
function clearLog() { $("log").innerHTML = ""; }

async function api(path, opts) {
  const resp = await fetch(path, opts);
  if (!resp.ok) {
    let detail = resp.statusText;
    try { detail = (await resp.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return resp.json();
}

/* ============ 多工作区 + 文件树 ============ */
let WORKSPACES = [];              // [{root,title,exists,running,stages}]
let WS_OPEN = new Set();          // 展开文件树的工作区
let TREES = {};                   // root -> tree
let DIR_OPEN = {};                // root -> Set(展开的目录路径)
let currentViewPath = "";
let wsTimer = null;

const fmtSize = (n) => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} K` : `${(n / 1048576).toFixed(1)} M`;

async function refreshWorkspaces(reloadTrees = false) {
  try {
    const data = await api("/api/workspaces");
    WORKSPACES = data.workspaces || [];
  } catch (e) { return; }
  for (const ws of WORKSPACES) {
    if (WS_OPEN.has(ws.root) && (reloadTrees || !TREES[ws.root] || ws.running)) {
      await loadTree(ws.root);
    }
  }
  renderWorkspaces();
}

async function loadTree(root) {
  try {
    const data = await api("/api/files?root=" + encodeURIComponent(root));
    TREES[root] = data.tree || [];
  } catch (e) { TREES[root] = []; }
}

function renderWorkspaces() {
  const box = $("wslist");
  if (!WORKSPACES.length) {
    box.innerHTML = '<div class="empty-tip">尚未添加工作区<br>· 新建题目：右侧「项目」区选题面后点「创建项目」<br>· 打开文件夹：点上方 ＋ 选任意文件夹</div>';
    return;
  }
  box.innerHTML = WORKSPACES.map(ws => {
    const active = ws.root === ACTIVE_ROOT ? " active" : "";
    const open = WS_OPEN.has(ws.root);
    const done = Object.values(ws.stages || {}).filter(s => s === "complete").length;
    const missing = ws.exists === false ? ' <span class="hint">(目录不存在)</span>' : "";
    return `<div class="wsitem${active}">
      <div class="wsrow">
        <span class="caret" data-toggle="${esc(ws.root)}">${open ? "▾" : "▸"}</span>
        <span class="wsname" data-activate="${esc(ws.root)}" title="${esc(ws.root)}">${esc(ws.title)}${missing}</span>
        ${ws.running ? '<span class="dotrun" title="该工作区有阶段在运行"></span>' : ""}
        <span class="wscount">${ws.is_project === false ? "非项目" : done + "/8"}</span>
        <span class="wsx" data-remove="${esc(ws.root)}" title="从列表移除（不影响磁盘文件）">×</span>
      </div>
      ${open ? `<div class="children">${renderTreeNodes(TREES[ws.root] || [], ws.root)}</div>` : ""}
    </div>`;
  }).join("");
  wireWsEvents(box);
}

function renderTreeNodes(nodes, root) {
  const exp = DIR_OPEN[root] || (DIR_OPEN[root] = new Set());
  return nodes.map(n => {
    if (n.type === "dir") {
      const open = exp.has(n.path);
      return `<div>
        <button class="node dir" data-dirtoggle="${esc(n.path)}" data-root="${esc(root)}" title="${esc(n.path)}">
          <span class="ic">${open ? "▾" : "▸"}</span><span class="nm">${esc(n.name)}</span>
        </button>
        ${open ? `<div class="children">${renderTreeNodes(n.children || [], root)}</div>` : ""}
      </div>`;
    }
    return `<button class="node" data-file="${esc(n.path)}" data-root="${esc(root)}" title="${esc(n.path)}">
      <span class="ic">·</span><span class="nm">${esc(n.name)}</span><span class="sz">${fmtSize(n.size || 0)}</span>
    </button>`;
  }).join("");
}

function wireWsEvents(box) {
  box.querySelectorAll("[data-toggle]").forEach(el => el.onclick = (ev) => {
    ev.stopPropagation();
    const root = el.dataset.toggle;
    if (WS_OPEN.has(root)) WS_OPEN.delete(root);
    else { WS_OPEN.add(root); loadTree(root).then(renderWorkspaces); }
    renderWorkspaces();
  });
  box.querySelectorAll("[data-activate]").forEach(el => el.onclick = () => activateWorkspace(el.dataset.activate));
  box.querySelectorAll("[data-remove]").forEach(el => el.onclick = async (ev) => {
    ev.stopPropagation();
    await api("/api/workspaces/remove", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({root: el.dataset.remove})});
    WS_OPEN.delete(el.dataset.remove);
    refreshWorkspaces(true);
  });
  box.querySelectorAll("[data-dirtoggle]").forEach(el => el.onclick = () => {
    const root = el.dataset.root, path = el.dataset.dirtoggle;
    const exp = DIR_OPEN[root] || (DIR_OPEN[root] = new Set());
    if (exp.has(path)) exp.delete(path); else exp.add(path);
    renderWorkspaces();
  });
  box.querySelectorAll("[data-file]").forEach(el => el.onclick = () => openViewer(el.dataset.root, el.dataset.file));
}

async function markActive(root) {
  ACTIVE_ROOT = root;
  localStorage.setItem("magent_root", root);
  try {
    await api("/api/workspaces/add", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({root})});
  } catch (e) { /* 非项目目录等情形不阻断主流程 */ }
  await refreshWorkspaces(true);
}

async function activateWorkspace(root) {
  if (!root || root === ACTIVE_ROOT) return;
  ACTIVE_ROOT = root;
  localStorage.setItem("magent_root", root);
  subscribe();          // 重新订阅该工作区的日志（含回放）
  refresh();
  refreshWorkspaces();
}

async function addWorkspacePrompt() {
  const api_ = window.pywebview && window.pywebview.api;
  if (!api_ || !api_.choose_folder) {
    msg("proj_msg", "请在「项目」区填路径后点「打开已有项目」", false);
    return;
  }
  const picked = await api_.choose_folder();
  if (!picked) return;
  try {
    await api("/api/workspaces/add", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({root: picked})});
    await refreshWorkspaces(true);
    activateWorkspace(picked);
  } catch (e) {
    const m = String(e.message || e);
    const lines = [
      "这个文件夹不是 MAgent 项目（缺少 project-manifest.json）。",
      "",
      "· 要开始新题目：在右侧「项目」区填标题后点「创建项目」",
      "· 要打开已有项目：选到包含 project-manifest.json 的文件夹",
      "",
      "原始信息：" + m,
    ];
    alert(lines.join("\n"));
  }
}

function scheduleWsRefresh() {
  if (wsTimer) clearTimeout(wsTimer);
  wsTimer = setTimeout(() => refreshWorkspaces(true), 1500);
}

/* ============ 文件预览 ============ */
async function openViewer(root, path) {
  currentViewPath = path;
  $("viewer_name").textContent = path;
  $("viewer_meta").textContent = "加载中…";
  $("viewer_body").innerHTML = "";
  $("viewer").classList.remove("hidden");
  try {
    const info = await api(`/api/file?root=${encodeURIComponent(root)}&path=${encodeURIComponent(path)}`);
    const raw = `/api/raw?root=${encodeURIComponent(root)}&path=${encodeURIComponent(path)}`;
    const size = fmtSize(info.size || 0);
    $("viewer_meta").textContent = size;
    if (info.kind === "text") {
      $("viewer_body").innerHTML = `<pre>${esc(info.content)}</pre>`;
    } else if (info.kind === "image") {
      $("viewer_body").innerHTML = `<div class="center"><img src="${raw}" alt=""></div>`;
    } else if (info.kind === "pdf") {
      $("viewer_body").innerHTML = `<iframe src="${raw}"></iframe>`;
    } else {
      $("viewer_body").innerHTML =
        `<div class="center">该文件类型无法在软件内预览（${esc(info.ext || "未知格式")}，${size}）<br>请点右上角「用系统程序打开」。</div>`;
    }
  } catch (e) {
    $("viewer_body").innerHTML = `<div class="center">打开失败：${esc(e.message)}</div>`;
  }
}

function closeViewer() {
  $("viewer").classList.add("hidden");
  $("viewer_body").innerHTML = "";
  currentViewPath = "";
}

async function openExternal() {
  if (!currentViewPath) return;
  try {
    await api("/api/open", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({root: ACTIVE_ROOT, path: currentViewPath}),
    });
  } catch (e) { $("viewer_meta").textContent = "打开失败：" + e.message; }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeViewer(); closeSettings(); }
});

/* ============ 设置视图：模型服务 ============ */

function providerCard(p) {
  return `<div class="prov" data-id="${esc(p.id)}">
    <div class="prov-head">
      <input data-f="name" value="${esc(p.name)}" placeholder="服务名称" onchange="refreshRouteOptions()">
      <span class="spacer"></span>
      <button onclick="testProvider(this)">测试连接</button>
      <button class="danger" onclick="removeProvider(this)">删除</button>
    </div>
    <div class="grid3">
      <div><label>Base URL</label><input class="mono" data-f="base_url" value="${esc(p.base_url)}" placeholder="https://api.deepseek.com"></div>
      <div><label>API Key</label><input class="mono" type="password" data-f="api_key" value="${esc(p.api_key)}" placeholder="sk-..."></div>
      <div><label>模型名</label><input class="mono" data-f="model" value="${esc(p.model)}" placeholder="deepseek-chat"></div>
    </div>
    <span class="msg"></span>
  </div>`;
}

function collectProviders() {
  return [...document.querySelectorAll("#providers .prov")].map(card => ({
    id: card.dataset.id,
    name: card.querySelector('[data-f="name"]').value.trim(),
    base_url: card.querySelector('[data-f="base_url"]').value.trim(),
    api_key: card.querySelector('[data-f="api_key"]').value.trim(),
    model: card.querySelector('[data-f="model"]').value.trim(),
  }));
}

function renderProviders(list) {
  $("providers").innerHTML = list.map(providerCard).join("") ||
    '<div class="empty-tip">还没有模型服务，点右上角「＋ 添加服务」。</div>';
  refreshRouteOptions();
}

function addProvider() {
  const id = "svc-" + Date.now().toString(36);
  const list = collectProviders();
  list.push({ id, name: "新服务", base_url: "", api_key: "", model: "" });
  $("providers").innerHTML = list.map(providerCard).join("");
  refreshRouteOptions();
  const cards = document.querySelectorAll("#providers .prov");
  cards[cards.length - 1]?.querySelector('[data-f="base_url"]')?.focus();
}

function removeProvider(btn) {
  const cards = document.querySelectorAll("#providers .prov");
  if (cards.length <= 1) { msg("settings_msg", "至少保留一个模型服务", false); return; }
  btn.closest(".prov").remove();
  refreshRouteOptions();
}

async function testProvider(btn) {
  const card = btn.closest(".prov");
  const out = card.querySelector(".msg");
  const data = {
    id: card.dataset.id,
    name: card.querySelector('[data-f="name"]').value.trim(),
    base_url: card.querySelector('[data-f="base_url"]').value.trim(),
    api_key: card.querySelector('[data-f="api_key"]').value.trim(),
    model: card.querySelector('[data-f="model"]').value.trim(),
  };
  out.className = "msg"; out.textContent = "测试中…";
  try {
    const r = await api("/api/config/test", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({provider_id: data.id, base_url: data.base_url, api_key: data.api_key, model: data.model}),
    });
    if (r.ok) { out.className = "msg ok"; out.textContent = `连接成功，${r.latency_ms} ms`; }
    else { out.className = "msg bad"; out.textContent = r.error; }
  } catch (e) { out.className = "msg bad"; out.textContent = e.message; }
}

/* ============ 设置视图：阶段路由 ============ */

function refreshRouteOptions() {
  const provs = collectProviders();
  const opts = provs.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");

  const defSel = $("route_default");
  const curDef = defSel.value;
  defSel.innerHTML = opts;
  if (provs.some(p => p.id === curDef)) defSel.value = curDef;

  document.querySelectorAll("#routes select").forEach(sel => {
    const cur = sel.value;
    sel.innerHTML = '<option value="">跟随默认</option>' + opts;
    if (provs.some(p => p.id === cur)) sel.value = cur;
  });
}

function renderRoutes(routing) {
  $("routes").innerHTML = META.stages.map(s =>
    `<div class="route-row">
       <span class="rname"><b>${esc(s.key)}</b>${esc(s.title)}</span>
       <select data-key="${esc(s.key)}"></select>
     </div>`).join("");
  refreshRouteOptions();
  $("route_default").value = routing.default || "";
  document.querySelectorAll("#routes select").forEach(sel => {
    sel.value = routing[sel.dataset.key] || "";
  });
}

function collectRouting() {
  const routing = { default: $("route_default").value };
  document.querySelectorAll("#routes select").forEach(sel => {
    if (sel.value) routing[sel.dataset.key] = sel.value;
  });
  return routing;
}

/* ============ 设置视图：打开 / 保存 ============ */

async function openSettings() {
  try {
    const cfg = await api("/api/config");
    renderProviders(cfg.providers || []);
    renderRoutes(cfg.routing || {});
    $("skills_root").value = cfg.skills_root || "";
    $("settingsView").classList.remove("hidden");
  } catch (e) { alert("读取配置失败：" + e.message); }
}

function closeSettings() {
  $("settingsView").classList.add("hidden");
}

async function saveSettings() {
  const providers = collectProviders();
  const bad = providers.find(p => !p.base_url || !p.model);
  if (bad) { msg("settings_msg", `服务「${bad.name || "未命名"}」缺少 Base URL 或模型名`, false); return; }
  // 掩码 key（***xxxx）视为已存储，服务端会保留原值
  if (!providers.some(p => p.api_key)) {
    msg("settings_msg", "至少为一个服务填写 API Key", false); return;
  }
  try {
    await api("/api/config", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ providers, routing: collectRouting(), skills_root: $("skills_root").value.trim() }),
    });
    msg("settings_msg", "已保存", true);
    refreshKeyBanner();
  } catch (e) { msg("settings_msg", e.message, false); }
}

async function refreshKeyBanner() {
  try {
    const cfg = await api("/api/config");
    const ready = (cfg.providers || []).some(p => p.api_key);
    $("key_banner").classList.toggle("hidden", ready);
  } catch (e) { /* 配置读不到时不打扰 */ }
}

  const total = n1 + n2;
  $("file_summary").textContent = total
    ? `已选 ${total} 个文件` + (n2 ? `（含文件夹内 ${n2} 个）` : "")

/* 新建项目：项目名与位置由软件自动生成（年份-竞赛+题型），无需用户填写 */
async function createProject() {
  const fd = new FormData();
  fd.append("focus", $("proj_focus").value || "均衡");
  for (const f of $("proj_files").files) fd.append("files", f, f.name);
  for (const f of $("proj_dir").files) fd.append("files", f, f.webkitRelativePath || f.name);
  msg("proj_msg", "创建中…", true);
  try {
    const st = await api("/api/project", {method: "POST", body: fd});
    $("proj_files").value = ""; $("proj_dir").value = ""; updateFileSummary();
    msg("proj_msg", st.added_files ? `已把 ${st.added_files.length} 个文件加入已有项目`
                                   : `已创建：${st.project_title || ""}`, true);
    await markActive(st.root);
    subscribe(); refresh(); refreshWorkspaces(true);
  } catch (e) { msg("proj_msg", e.message, false); }
}

/* 把当前工作区（非项目文件夹）初始化为项目——用户点确认后才写入文件 */
async function initCurrentWorkspace() {
  if (!ACTIVE_ROOT) return;
  try {
    const st = await api("/api/project/init", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({root: ACTIVE_ROOT})});
    const adopted = st.adopted_files || [];
    msg("proj_msg", adopted.length ? `已初始化，并收纳 ${adopted.length} 个题面/数据文件到 data/`
                                   : "已初始化为项目", true);
    refreshWorkspaces(true); refresh(); subscribe();
  } catch (e) { msg("proj_msg", e.message, false); }
}

async function subscribe() {
  if (es) { es.close(); es = null; }
  if (!ACTIVE_ROOT) return;
  let cursor = null;
  try {  // 回放该工作区已有日志（切换工作区时不丢上下文）
    const past = await api("/api/events?root=" + encodeURIComponent(ACTIVE_ROOT) + "&after=0");
    const items = (past.events || []).slice(-300);
    if (items.length) {
      clearLog();
      for (const e of items) renderEvent(e);
    }
    cursor = past.cursor;
  } catch (e) { /* 回放失败不影响实时流 */ }
  const url = "/api/stream?root=" + encodeURIComponent(ACTIVE_ROOT) + (cursor !== null ? "&after=" + cursor : "");
  es = new EventSource(url);
  es.onmessage = (ev) => renderEvent(JSON.parse(ev.data));
}

function renderEvent(e) {
  if (!e) return;
  {
    const e = JSON.parse(ev.data);
    const t = `<span class="t">[${e.ts}]</span>`;
    if (e.type === "stage") { logLine(`${t} ${e.msg}`); scheduleWsRefresh(); }
    else if (e.type === "tool_call") logLine(`${t} <span class="dim">→ ${e.name}(${(e.args || "").slice(0, 140)})</span>`);
    else if (e.type === "gate") { logLine(`${t} <span class="${e.ok ? "ok" : e.skipped ? "dim" : "bad"}">${e.skipped ? "— 跳过" : e.ok ? "✔ 通过" : "✘ 未过"} 门禁 ${e.name} (exit ${e.exit_code})</span>`); scheduleWsRefresh(); }
    else if (e.type === "file_written") { logLine(`${t} <span class="dim">写入 ${e.path}</span>`); scheduleWsRefresh(); }
    else if (e.type === "reasoning") logLine(`${t} <span class="think">💭 思考：${e.text}</span>`);
    else if (e.type === "assistant_text") logLine(`${t} <span class="dim">${e.text}</span>`);
    else if (e.type === "error") logLine(`${t} <span class="bad">✗ ${e.msg}</span>`);
  }
}

const STATUS_TEXT = {pending:"待执行", in_progress:"进行中", complete:"已通过", failed:"驳回", n_a:"不适用", conditional:"有条件"};

async function refresh() {
  if (!ACTIVE_ROOT) return;
  let st;
  try { st = await api("/api/state?root=" + encodeURIComponent(ACTIVE_ROOT)); }
  catch (e) { return; }
  $("proj_now").textContent = st.manifest_ok ? st.project_title : "";

  // 活动工作区还不是项目时，提示一键初始化
  $("init_banner").classList.toggle("hidden", !!st.manifest_ok || !ACTIVE_ROOT);
  if (!st.manifest_ok && ACTIVE_ROOT) {
    $("init_banner_text").textContent = `${ACTIVE_ROOT} 还不是 MAgent 项目`;
  }

  // 运行状态：任何任务（全流程或单阶段）在跑时都显示「停止」
  const busy = !!st.pipeline_running || !!st.running_stage || (st.stages || []).some(s => s.running);
  const doneCount = (st.stages || []).filter(s => ["complete", "n_a"].includes(s.status)).length;
  const label = doneCount === 0 ? "▶&nbsp;全自动运行" : "▶&nbsp;继续（全自动）";
  const stepLabel = doneCount === 0 ? "▶&nbsp;逐步运行" : "▶&nbsp;继续（逐步）";
  $("pipe_auto_btn").innerHTML = label;
  $("pipe_step_btn").innerHTML = stepLabel;
  $("pipe_auto_btn").classList.toggle("hidden", busy);
  $("pipe_step_btn").classList.toggle("hidden", busy);
  $("pipe_stop_btn").classList.toggle("hidden", !busy);
  const runningTitle = st.running_stage ? (pipeline_title(st.running_stage) + " 运行中…") : "全流程运行中…";
  $("pipe_hint").textContent = busy ? runningTitle : (doneCount ? `已完成 ${doneCount}/8` : "");

  const box = $("stages"); box.innerHTML = "";
  for (const s of st.stages) {
    const div = document.createElement("div");
    div.className = "stop";
    if (s.status === "complete") div.classList.add("done");
    if (s.status === "failed") div.classList.add("bad");
    if (s.status === "in_progress") div.classList.add("on", "running");

    let actions = "";
    if (["pending", "failed"].includes(s.status)) {
      actions += `<button class="primary" onclick="startStage('${s.key}')">启动</button>`;
      actions += `<button onclick="markNA('${s.key}')">标记不适用</button>`;
    }
    if (s.status === "in_progress") {
      actions += `<button onclick="fixStage('${s.key}')">${s.running ? "运行中…" : "继续修复"}</button>`;
    }
    const tt = (st.stage_times || {})[s.key];
    const usedText = s.running
      ? `⏱ ${fmtDuration(s.elapsed ?? st.stage_elapsed ?? 0)}`
      : (tt ? `⏱ 上次 ${fmtDuration(tt.seconds)}` : "");
    div.innerHTML = `
      <div class="dot"></div>
      <div class="name">${s.title}</div>
      ${usedText ? `<div class="usedtime">${usedText}</div>` : ""}
      <div><span class="pill st-${s.status}"><i></i><span class="label">${STATUS_TEXT[s.status] || s.status}</span></span></div>
      <div class="actions">${actions}</div>`;
    box.appendChild(div);
  }
}

async function startStage(key) { await act(`/api/stage/start`, key); }
async function fixStage(key) { await act(`/api/stage/fix`, key); }

async function startPipeline(mode) {
  try {
    await api("/api/pipeline/start", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({root: ACTIVE_ROOT, mode})});
    refresh();
  } catch (e) { logLine(`<span class="bad">✗ ${e.message}</span>`); }
}

async function stopPipeline() {
  const btn = $("pipe_stop_btn");
  btn.disabled = true;
  try {
    await api("/api/stop", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({root: ACTIVE_ROOT})});
    logLine('<span class="bad">⏹ 已请求停止，正在中断当前步骤…</span>');
  } catch (e) {
    logLine(`<span class="bad">✗ ${e.message}</span>`);
  } finally {
    setTimeout(() => { btn.disabled = false; }, 4000);
    refresh();
  }
}

/* 阶段 key → 中文名（用于运行提示） */
function fmtDuration(sec) {
  const s = Math.max(0, Math.round(sec || 0));
  if (s < 60) return s + " 秒";
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return m + " 分 " + r + " 秒";
  return Math.floor(m / 60) + " 时 " + (m % 60) + " 分";
}

function pipeline_title(key) {
  const found = (META.stages || []).find(s => s.key === key);
  return found ? found.title : key;
}
async function act(url, key) {
  try {
    await api(url, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({root: ACTIVE_ROOT, stage: key})});
    refresh();
  } catch (e) { logLine(`<span class="bad">✗ ${e.message}</span>`); }
}
async function markNA(key) {
  const reason = prompt(`把「${key}」标记为不适用（n_a），请输入原因：`);
  if (reason === null) return;
  try {
    await api("/api/stage/na", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({root: ACTIVE_ROOT, stage: key})});
    refresh();
  } catch (e) { logLine(`<span class="bad">✗ ${e.message}</span>`); }
}

async function boot() {
  try { META = await api("/api/meta"); } catch (e) {}
  $("ver").textContent = "MAgent v" + (META.version || "");
  wireFileInputs();
  await refreshKeyBanner();
  await refreshWorkspaces(true);
  if (ACTIVE_ROOT) subscribe();
  refresh();
  timer = setInterval(refresh, 4000);
  setInterval(() => refreshWorkspaces(), 15000);  // 工作区状态与运行指示
}

// 桌面窗口（pywebview）就绪后显示原生「浏览…」按钮；浏览器模式不支持
window.addEventListener("pywebviewready", () => {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.choose_folder) {
    $("browse_btn").classList.remove("hidden");
  }
});
setTimeout(() => {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.choose_folder) {
    $("browse_btn").classList.remove("hidden");
  }
}, 1200);
boot();
</script>
